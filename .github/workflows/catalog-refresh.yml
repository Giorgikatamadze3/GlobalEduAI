name: Refresh university and programme catalogue
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_PROVIDER: postgres
      AUTH_DB_DRIVER: sqlite
      AUTH_DB_PATH: ':memory:'
      CMS_DB_PATH: ':memory:'
      BILLING_DB_PATH: ':memory:'
      OPENAI_API_KEY: ''
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - name: Fetch registered sources and preserve unsuccessful snapshots
        run: node scripts/refresh-catalog.js --write
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Publish verified data without overwriting a newer main branch
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Server/data/institutions.json Server/data/programs.json Server/data/program-source-registry.json Server/data/program-import-report.json Server/data/world-programme-import-report.json Server/data/catalog-refresh-status.json docs/third-party/HIPO-LICENSE.txt
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified catalogue sources [automated]"
            git push origin HEAD:main
          fi
